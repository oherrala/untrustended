name: ci
permissions:
  contents: read
on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-26, xcode-27 ]
        rust:
          - stable
          - beta
          - nightly
          - 1.98.1  # MSRV
    steps:
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup override set ${{ matrix.rust }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo test -v --no-default-features
      - run: cargo test -v --no-default-features --features alloc
      - run: cargo test -v --no-default-features --features std,alloc
      - run: cargo test -v

  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo check -v
      - run: cargo clippy -- -D warnings
